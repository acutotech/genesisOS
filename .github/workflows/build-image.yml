name: Build image

on:
  # Every push and pull request gets lint + dry-run; the image build below is
  # gated to main, v* tags and manual runs.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner. ubuntu-24.04-arm builds natively; ubuntu-latest (x86-64)
          emulates arm64 with QEMU and is several times slower.
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-latest
      pi-gen-ref:
        description: >-
          pi-gen branch or tag. "arm64" is the current 64-bit branch; tags look
          like 2026-10-06-raspios-trixie-arm64.
        type: string
        default: arm64

permissions:
  contents: read

jobs:
  lint:
    name: Lint and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq shellcheck yamllint python3-yaml

      - name: shellcheck and yamllint
        run: make lint-shell lint-yaml

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Dry-run the custom stage
        run: make test

  shell-preview:
    name: Genesis Shell headless preview
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the desktop stack (Raspberry Pi labwc when reachable)
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg
          key=/usr/share/keyrings/raspberrypi-archive.gpg
          if curl -fsSL --retry 3 https://archive.raspberrypi.com/debian/raspberrypi.gpg.key | gpg --dearmor -o "$key"; then
            echo "deb [signed-by=$key] https://archive.raspberrypi.com/debian/ trixie main" \
              > /etc/apt/sources.list.d/raspi.list
            apt-get update -qq || rm -f /etc/apt/sources.list.d/raspi.list
          fi
          sed -e 's/#.*//' stage-custom/11-genesis-shell/00-packages \
            | xargs apt-get install -y -qq --no-install-recommends
          apt-get install -y -qq --no-install-recommends dbus dbus-bin dbus-daemon lxterminal \
            fonts-inter fonts-jetbrains-mono fonts-dejavu-core gtk-update-icon-cache \
            desktop-file-utils shared-mime-info at-spi2-core librsvg2-common xwayland
          labwc --version
          python3 -c 'import gi; gi.require_version("GtkLayerShell", "0.1"); from gi.repository import GtkLayerShell' \
            && echo "gtk-layer-shell ok"

      - name: Install Genesis Shell the way the image build does
        shell: bash
        run: |
          set -euo pipefail
          stage-custom/11-genesis-shell/files/install.sh --root / --branding stage-custom/10-branding/files
          /usr/share/genesis-shell/install.sh --postinstall
          ls /usr/lib/genesis-shell/genesis_shell/protocols

      - name: Run the desktop headless and take screenshots
        shell: bash
        env:
          GENESIS_PREVIEW_PRINT_B64: "1"
        run: /usr/share/genesis-shell/preview.sh "$PWD/preview"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genesis-shell-preview
          path: preview/
          if-no-files-found: warn
          retention-days: 14

  imager-test:
    name: Genesis Imager tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s imager -v

  imager-build:
    name: Genesis Imager app (${{ matrix.name }})
    needs: imager-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x64}
          - {os: macos-latest, name: macos-arm64}
          - {os: ubuntu-24.04, name: linux-x86_64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build with PyInstaller
        shell: bash
        env:
          TARGET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pyinstaller==6.22.2 pillow==12.2.0
          icons=stage-custom/10-branding/files/icons/hicolor
          mkdir -p imager-build out
          cp "$icons/64x64/apps/genesis-os.png" imager-build/genesis-os.png
          sep=:
          [ "${RUNNER_OS}" = Windows ] && sep=';'
          common=(--noconfirm --clean --windowed --distpath imager-build/dist --workpath imager-build/work
                  --specpath imager-build --icon "$PWD/$icons/256x256/apps/genesis-os.png"
                  --add-data "$PWD/imager-build/genesis-os.png${sep}.")
          case "${RUNNER_OS}" in
            Windows)
              # --uac-admin: Windows asks for administrator rights when the app starts
              python -m PyInstaller "${common[@]}" --onefile --uac-admin --name GenesisImager imager/genesis_imager.py
              app=imager-build/dist/GenesisImager.exe
              "$app" --write-placeholder out/placeholder.txt
              cp "$app" "out/genesis-imager-${TARGET}.exe"
              ;;
            macOS)
              python -m PyInstaller "${common[@]}" --name "Genesis Imager" \
                --osx-bundle-identifier org.genesisos.imager imager/genesis_imager.py
              "imager-build/dist/Genesis Imager.app/Contents/MacOS/Genesis Imager" --write-placeholder out/placeholder.txt
              ditto -c -k --keepParent "imager-build/dist/Genesis Imager.app" "out/genesis-imager-${TARGET}.zip"
              ;;
            Linux)
              python -m PyInstaller "${common[@]}" --onefile --name genesis-imager imager/genesis_imager.py
              imager-build/dist/genesis-imager --write-placeholder out/placeholder.txt
              cp imager-build/dist/genesis-imager "out/genesis-imager-${TARGET}"
              ;;
          esac
          # the app runs and produces the setup area the image carries
          cmp out/placeholder.txt stage-custom/14-first-boot/files/genesis-setup.txt
          rm out/placeholder.txt
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genesis-imager-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 30
  build:
    name: Build image
    needs: [lint, shell-preview, imager-test]
    # Full builds take a long time: only main, release tags and manual runs.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 300
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      image-name: ${{ steps.cfg.outputs.img_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build config
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./config
          known=(IMG_NAME PI_GEN_RELEASE RELEASE BASE_STAGES TARGET_HOSTNAME FIRST_USER_NAME
                 LOCALE_DEFAULT KEYBOARD_KEYMAP KEYBOARD_LAYOUT TIMEZONE_DEFAULT WPA_COUNTRY
                 ENABLE_SSH PUBKEY_ONLY_SSH PASSWORDLESS_SUDO ENABLE_CLOUD_INIT
                 DEPLOY_COMPRESSION COMPRESSION_LEVEL)
          # Every assignment in config must be one this workflow forwards, or it
          # would silently apply to local builds only.
          while read -r name; do
            if [[ " ${known[*]} " != *" ${name} "* ]]; then
              echo "::error file=config::${name} is set in config but the workflow does not forward it to pi-gen-action"
              exit 1
            fi
          done < <(grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' ./config | tr -d '=')
          for var in "${known[@]}"; do
            value="${!var:-}"
            if [[ "${value}" == *$'\n'* ]]; then
              echo "::error file=config::${var} must be a single line"
              exit 1
            fi
            printf '%s=%s\n' "${var,,}" "${value}" >> "${GITHUB_OUTPUT}"
          done
          cat "${GITHUB_OUTPUT}"

      - name: Check secrets and write stage files
        env:
          FIRST_USER_PASS: ${{ secrets.FIRST_USER_PASS }}
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          PASSWORDLESS_SUDO: ${{ steps.cfg.outputs.passwordless_sudo }}
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
          ALLOW_SECRETS_IN_PUBLIC_IMAGE: ${{ vars.ALLOW_SECRETS_IN_PUBLIC_IMAGE }}
        shell: bash
        run: |
          set -euo pipefail
          # Artifacts and releases of a public repository are public. An image that
          # embeds a password hash or a Wi-Fi passphrase would publish them.
          if [ "${REPO_IS_PRIVATE}" != "true" ] && [ "${ALLOW_SECRETS_IN_PUBLIC_IMAGE}" != "true" ] \
             && { [ -n "${FIRST_USER_PASS}" ] || [ -n "${WIFI_PASSWORD}" ]; }; then
            msg="This repository is public, so the built image (artifact, release) is public too, and it"
            msg="${msg} would contain FIRST_USER_PASS (hashed) and/or WIFI_PASSWORD (clear text). Make the"
            msg="${msg} repository private, remove those secrets, or set the repository variable"
            msg="${msg} ALLOW_SECRETS_IN_PUBLIC_IMAGE=true to accept this."
            echo "::error::${msg}"
            exit 1
          fi
          # pi-gen writes FIRST_USER_PASS into an unquoted shell heredoc (chpasswd)
          # and the action writes both values into a double-quoted config file, so
          # these characters would silently change the password or break the build.
          if [[ "${FIRST_USER_PASS}" == *[\"\$\`\\]* || "${FIRST_USER_PASS}" == *$'\n'* ]]; then
            echo '::error::FIRST_USER_PASS must not contain " $ ` \ or newlines (pi-gen limitation)'
            exit 1
          fi
          if [[ "${SSH_AUTHORIZED_KEYS}" == *[\"\$\`\\]* ]]; then
            echo '::error::SSH_AUTHORIZED_KEYS must not contain " $ ` or \ (pi-gen limitation)'
            exit 1
          fi
          if [ -n "${SSH_AUTHORIZED_KEYS}" ] && [ -z "${FIRST_USER_PASS}" ]; then
            msg="SSH_AUTHORIZED_KEYS is set but FIRST_USER_PASS is not. pi-gen leaves the first user's shell"
            msg="${msg} as nologin until a password exists, so SSH key logins are refused and the console"
            msg="${msg} wizard runs. Set FIRST_USER_PASS for a headless device."
            echo "::warning::${msg}"
          fi
          umask 077
          {
            printf '# Generated by the workflow. Never committed.\n'
            printf 'WIFI_SSID=%q\n' "${WIFI_SSID}"
            printf 'WIFI_PASSWORD=%q\n' "${WIFI_PASSWORD}"
          } > stage-custom/secrets.env
          {
            printf 'CUSTOM_GIT_SHA=%q\n' "${GITHUB_SHA}"
            printf 'CUSTOM_GIT_REF=%q\n' "${GITHUB_REF_NAME}"
            printf 'CUSTOM_BUILD_URL=%q\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            # pi-gen-action v1.11.0 has no passwordless-sudo input; the stage applies it.
            printf 'PASSWORDLESS_SUDO=%q\n' "${PASSWORDLESS_SUDO}"
          } > stage-custom/build-info.env
          echo "Wi-Fi: $([ -n "${WIFI_SSID}" ] && echo configured || echo 'not configured (no WIFI_SSID secret)')"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') free on /"
          # pi-gen-action's own cleanup (increase-runner-disk-size) runs apt purge
          # with x86-only package names and fails on arm64 runners (v1.11.0), so
          # free space here with plain path removals that need nothing from apt.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /usr/local/julia* /opt/hostedtoolcache/CodeQL \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/lib/mono /opt/az \
            /usr/share/miniconda /opt/pipx /usr/local/share/powershell
          sudo docker system prune --all --force --volumes > /dev/null 2>&1 || true
          sudo swapoff -a 2> /dev/null || true
          sudo rm -f /mnt/swapfile /swapfile
          echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') free on /"

      - name: Build with pi-gen
        id: build
        uses: usimd/pi-gen-action@cec66cba86bdcd23984e6a79ea4e9251d90bc798 # v1.11.0
        with:
          image-name: ${{ steps.cfg.outputs.img_name }}
          pi-gen-version: ${{ inputs.pi-gen-ref || 'arm64' }}
          pi-gen-release: ${{ steps.cfg.outputs.pi_gen_release }}
          release: ${{ steps.cfg.outputs.release }}
          stage-list: ${{ steps.cfg.outputs.base_stages }} ./stage-custom
          export-last-stage-only: true
          hostname: ${{ steps.cfg.outputs.target_hostname }}
          username: ${{ steps.cfg.outputs.first_user_name }}
          # Without a password pi-gen locks the account and arms the first-boot
          # user wizard; with one, the user is usable immediately.
          password: ${{ secrets.FIRST_USER_PASS }}
          disable-first-boot-user-rename: ${{ secrets.FIRST_USER_PASS != '' && '1' || '0' }}
          enable-ssh: ${{ steps.cfg.outputs.enable_ssh }}
          pubkey-ssh-first-user: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          pubkey-only-ssh: ${{ secrets.SSH_AUTHORIZED_KEYS != '' && steps.cfg.outputs.pubkey_only_ssh || '0' }}
          locale: ${{ steps.cfg.outputs.locale_default }}
          keyboard-keymap: ${{ steps.cfg.outputs.keyboard_keymap }}
          keyboard-layout: ${{ steps.cfg.outputs.keyboard_layout }}
          timezone: ${{ steps.cfg.outputs.timezone_default }}
          wpa-country: ${{ steps.cfg.outputs.wpa_country }}
          enable-cloud-init: ${{ steps.cfg.outputs.enable_cloud_init }}
          compression: ${{ steps.cfg.outputs.deploy_compression }}
          compression-level: ${{ steps.cfg.outputs.compression_level }}
          # Disabled: v1.11.0's cleanup fails on arm64 runners (see step above).
          increase-runner-disk-size: false
          # pi-gen's work directory (and its build.log) normally lives only inside
          # the build container, which the action removes afterwards. Mount it on
          # the runner so the log can be uploaded when the build fails.
          docker-opts: -v ${{ github.workspace }}/pi-gen-work:/pi-gen/work
          verbose-output: true

      - name: Checksums and summary
        env:
          IMAGE_PATH: ${{ steps.build.outputs.image-path }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "${IMAGE_PATH}")"
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          ls -lh
          {
            echo "### Image build"
            echo
            echo "Image: \`$(basename "${IMAGE_PATH}")\` ($(du -h "${IMAGE_PATH}" | cut -f1))"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Smoke-test the desktop inside the image
        id: smoke
        env:
          IMAGE_PATH: ${{ steps.build.outputs.image-path }}
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=IMAGE_PATH scripts/image-smoke.sh "${IMAGE_PATH}" image-smoke
          {
            echo "### Desktop smoke test"
            echo
            echo "Result: \`$(cat image-smoke/result 2>/dev/null || echo unknown)\`"
            echo "(0 = the Genesis session came up headless and every screenshot has content)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload smoke-test screenshots
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genesis-image-smoke
          path: image-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload image
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cfg.outputs.img_name }}
          path: pi-gen/deploy/
          if-no-files-found: error
          retention-days: 14
          # The image is already xz/zip compressed.
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: |
            pi-gen-work/*/build.log
            pi-gen-work/*/*/debootstrap.log
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [build, imager-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.image-name }}
          path: deploy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: genesis-imager-*
          merge-multiple: true
          path: imager

      - name: Imager checksums
        run: cd imager && sha256sum -- * > SHA256SUMS-imager && cat SHA256SUMS-imager

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Everything pi-gen deployed, so SHA256SUMS matches the attached files.
          files: |
            deploy/*
            imager/*
          fail_on_unmatched_files: true
          generate_release_notes: true
