# Genesis OS: rpi-eeprom-update.service removes staged bootloader updates
# whenever it runs (an rpi-eeprom upgrade restarts it). genesis-eeprom notes
# whether the update it staged was intact before and gone after, so it can stage
# it again at the next boot; one a user took back any other way stays taken back.
[Service]
ExecStartPre=-/usr/lib/genesis/genesis-eeprom watch before
ExecStartPost=-/usr/lib/genesis/genesis-eeprom watch after
# when -s -a fails after removing the update, ExecStartPost is skipped but this runs;
# after a successful start the marker is gone and it does nothing
ExecStopPost=-/usr/lib/genesis/genesis-eeprom watch after
