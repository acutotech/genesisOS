# shellcheck shell=bash disable=SC2034
# Non-secret knobs for the custom stage. Sourced by stage-custom/lib.sh.
#
# Every entry is VAR="${VAR:-default}", so an environment variable that is
# already set wins over this file. Secrets (WIFI_PASSWORD and friends) belong
# in stage-custom/secrets.env (git-ignored), which is sourced after this file
# and uses plain VAR=value assignments.

# --- Wi-Fi -------------------------------------------------------------------
# When WIFI_SSID is non-empty, a netplan network-config for cloud-init is
# written to the boot partition and applied on first boot. The credentials sit
# in clear text on the FAT boot partition, exactly as Raspberry Pi Imager
# stores them. Leave WIFI_SSID empty to ship no Wi-Fi configuration.
WIFI_SSID="${WIFI_SSID:-}"
WIFI_PASSWORD="${WIFI_PASSWORD:-}"   # 8-63 characters, or empty for an open network
WIFI_HIDDEN="${WIFI_HIDDEN:-0}"      # 1 when the SSID is not broadcast
WIFI_INTERFACE="${WIFI_INTERFACE:-wlan0}"

# --- Hardware interfaces -----------------------------------------------------
# Applied with raspi-config inside the image (13-system-defaults) and mirrored
# into /boot/firmware/config.txt by 01-system so Lite builds get them too.
ENABLE_I2C="${ENABLE_I2C:-1}"                      # dtparam=i2c_arm=on
ENABLE_SPI="${ENABLE_SPI:-1}"                      # dtparam=spi=on
ENABLE_SERIAL_PORT="${ENABLE_SERIAL_PORT:-1}"      # UART on GPIO 14/15 (Pi 5: dtparam=uart0=on)
ENABLE_SERIAL_CONSOLE="${ENABLE_SERIAL_CONSOLE:-0}" # login shell on that UART (0 keeps it free for devices)
ENABLE_ONEWIRE="${ENABLE_ONEWIRE:-0}"              # dtoverlay=w1-gpio
ENABLE_VNC="${ENABLE_VNC:-1}"                      # wayvnc service (Wayland VNC server)
# Extra config.txt lines, newline separated, appended verbatim under [all].
CONFIG_TXT_EXTRA="${CONFIG_TXT_EXTRA:-}"

# --- Raspberry Pi 5 bootloader (EEPROM) -----------------------------------------
# Applied once, on the Pi, by genesis-eeprom.service (15-bootloader): it edits
# the config the bootloader is running, stages the update, and the bootloader
# takes it at the next reboot. Nothing is written to a Pi other than a Pi 5.
EEPROM_CUSTOMIZE="${EEPROM_CUSTOMIZE:-1}"            # 0: never touch the bootloader
# Which medium is tried first. auto: the one Genesis OS booted from (an SD card,
# NVMe drive or USB drive all work, and the box keeps preferring the medium it
# was set up on); the other two stay as fallbacks. sd | nvme | usb | keep
EEPROM_BOOT_FIRST="${EEPROM_BOOT_FIRST:-auto}"
# 1: also find NVMe drives on M.2 adapters that are not HAT+ (PCIE_PROBE). 0 | 1 | keep
EEPROM_PCIE_PROBE="${EEPROM_PCIE_PROBE:-1}"
# 0: no Raspberry Pi network-install screen at every power-on; it stays available
# on demand (hold SHIFT) and when nothing boots. 0 | 1 | keep
EEPROM_NET_INSTALL_AT_POWER_ON="${EEPROM_NET_INSTALL_AT_POWER_ON:-0}"
# 1: about 0.01 W after shutdown (some HATs dislike it). 0 | 1 | keep
EEPROM_POWER_OFF_ON_HALT="${EEPROM_POWER_OFF_ON_HALT:-keep}"

# --- Genesis desktop -----------------------------------------------------------
# The Genesis session is labwc (Raspberry Pi's compositor) running Genesis
# Shell: our own panel, launcher, control center, notifications and wallpaper.
# Raspberry Pi's stock labwc desktop stays installed as a fallback session.
GENESIS_WALLPAPER="${GENESIS_WALLPAPER:-genesis-horizon}"   # name of a file in 10-branding/files/wallpapers
GENESIS_PANEL_POSITION="${GENESIS_PANEL_POSITION:-top}"     # top | bottom
GENESIS_PANEL_LAUNCHERS="${GENESIS_PANEL_LAUNCHERS:-chromium code pcmanfm lxterminal genesis-settings}"
GENESIS_ACCENT="${GENESIS_ACCENT:-#4f8cff}"                 # accent colour of the shell and the GTK theme
GENESIS_BLANK_TIMEOUT="${GENESIS_BLANK_TIMEOUT:-600}"       # seconds of idling before the screen blanks (0 = never)
DESKTOP_AUTOLOGIN="${DESKTOP_AUTOLOGIN:-1}"                 # 1: boot straight into the desktop as the first user
DEFAULT_BROWSER="${DEFAULT_BROWSER:-chromium}"              # chromium | firefox
ENABLE_BOOT_SPLASH="${ENABLE_BOOT_SPLASH:-1}"               # Plymouth splash with the Genesis logo

# --- Developer tools -----------------------------------------------------------
INSTALL_VSCODE="${INSTALL_VSCODE:-1}"
VSCODE_EXTENSIONS="${VSCODE_EXTENSIONS:-ms-python.python ms-python.vscode-pylance ms-python.debugpy}"
# User Pythons, each under /opt/python/<series>. PYTHON_PRIMARY is "python",
# "pip" and VS Code's interpreter; PYTHON_LATEST is the newest stable release.
# python3 stays the system interpreter (Debian's 3.13): apt, raspi-config and the
# desktop run on it. Pinned versions: 3.10.22 3.14.9 3.15.1 (08-python); a version of the system's own
# series (3.13) is refused.
PYTHON_PRIMARY="${PYTHON_PRIMARY:-3.10.22}"       # python3.10 / pip3.10, default python
PYTHON_LATEST="${PYTHON_LATEST:-3.15.1}"          # python3.15 / pip3.15 (empty = none)

# --- System behaviour ----------------------------------------------------------
PERSISTENT_JOURNAL="${PERSISTENT_JOURNAL:-1}"                  # keep journald logs across reboots
JOURNAL_MAX_USE="${JOURNAL_MAX_USE:-64M}"
ENABLE_UNATTENDED_UPGRADES="${ENABLE_UNATTENDED_UPGRADES:-1}"  # automatic security updates

# --- Build host ----------------------------------------------------------------
# Delete the earlier stages' root filesystem copies once this stage has its own
# (several GB each; only this stage is exported). 0 keeps them for CONTINUE=1
# debugging of an earlier stage.
GENESIS_PRUNE_WORK="${GENESIS_PRUNE_WORK:-1}"

# --- systemd units -------------------------------------------------------------
# Space separated unit names to enable or disable in the image, for example
# DISABLE_SERVICES="bluetooth.service hciuart.service" on a device without BT.
ENABLE_SERVICES="${ENABLE_SERVICES:-}"
DISABLE_SERVICES="${DISABLE_SERVICES:-}"
